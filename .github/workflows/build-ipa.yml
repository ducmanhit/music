name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show environment
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: Create iOS project
        shell: bash
        run: |
          set -euo pipefail
          ORG="${{ vars.FLUTTER_ORG }}"
          BUNDLE_ID="${{ vars.BUNDLE_ID }}"
          [ -n "$ORG" ] || ORG="com.ducmanhit"
          [ -n "$BUNDLE_ID" ] || BUNDLE_ID="com.ducmanhit.offlinemusic"

          flutter create \
            --platforms=ios \
            --org "$ORG" \
            --project-name offline_music \
            .

          python3 scripts/configure_ios.py \
            --bundle-id "$BUNDLE_ID" \
            --display-name "Offline Music"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"
          PACKAGE_DIR="$RUNNER_TEMP/offline-music-ipa"
          IPA_DIR="$GITHUB_WORKSPACE/build/ios/ipa"
          IPA_PATH="$IPA_DIR/OfflineMusic-unsigned.ipa"

          rm -rf "$PACKAGE_DIR" "$IPA_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$IPA_DIR"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          find "$PACKAGE_DIR/Payload/Runner.app" -type d -name _CodeSignature -prune -exec rm -rf {} + || true
          find "$PACKAGE_DIR/Payload/Runner.app" -name embedded.mobileprovision -delete || true
          find "$PACKAGE_DIR/Payload/Runner.app" -name CodeResources -delete || true
          xattr -cr "$PACKAGE_DIR/Payload/Runner.app" || true

          cd "$PACKAGE_DIR"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"

          test -s "$IPA_PATH"
          unzip -l "$IPA_PATH" | grep -q 'Payload/Runner.app/Info.plist'
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offline-Music-Unsigned-IPA
          path: build/ios/ipa/OfflineMusic-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
