name: offline_music
description: Trình phát nhạc offline cho iPhone với giao diện Liquid Glass sáng, trung tính và build IPA bằng GitHub Actions.
publish_to: "none"
version: 6.0.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  path: ^1.9.1
  audio_metadata_reader: ^1.7.0
  http: ^1.6.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
